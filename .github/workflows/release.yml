name: Release erstellen

on:
  push:
    tags:
      - "v*.*.*"
      - "release-*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag des Release, zum Beispiel v1.0.0"
        required: true
        type: string
      is_prerelease:
        description: "Als Vorabversion markieren"
        required: false
        type: boolean
        default: false

env:
  TYPST_VERSION: "0.15.1"

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Typst installieren
        uses: ./.github/actions/install-typst
        with:
          version: ${{ env.TYPST_VERSION }}

      - name: Tag bestimmen
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "TAG=$TAG" >> "$GITHUB_OUTPUT"

      - name: pypdf installieren
        run: pip install pypdf

      - name: Änderungsmarkierungen prüfen
        run: make check

      - name: PDFs bauen
        run: make compile

      - name: PDFs nach dem Tag benennen
        run: |
          for name in Organisationssatzung QSM-Ordnung Finanzordnung Beitragssatzung; do
            cp "build/$name.pdf" "${name}_${{ steps.version.outputs.TAG }}.pdf"
            cp "build/${name}_Aenderungen.pdf" "${name}_Aenderungen_${{ steps.version.outputs.TAG }}.pdf"
          done

      - name: Release erstellen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.TAG }}
          name: "Satzungen ${{ steps.version.outputs.TAG }}"
          files: |
            Organisationssatzung_${{ steps.version.outputs.TAG }}.pdf
            QSM-Ordnung_${{ steps.version.outputs.TAG }}.pdf
            Finanzordnung_${{ steps.version.outputs.TAG }}.pdf
            Beitragssatzung_${{ steps.version.outputs.TAG }}.pdf
            Organisationssatzung_Aenderungen_${{ steps.version.outputs.TAG }}.pdf
            QSM-Ordnung_Aenderungen_${{ steps.version.outputs.TAG }}.pdf
            Finanzordnung_Aenderungen_${{ steps.version.outputs.TAG }}.pdf
            Beitragssatzung_Aenderungen_${{ steps.version.outputs.TAG }}.pdf
          prerelease: ${{ github.event.inputs.is_prerelease == 'true' }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
