name: Continuous Build and Latest Release

on:
  push:
    branches:
      - main
    tags-ignore:
      - "v*.*.*"
      - "release-*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  TYPST_VERSION: "0.15.1"

jobs:
  build-and-update-latest:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install Typst
        uses: ./.github/actions/install-typst
        with:
          version: ${{ env.TYPST_VERSION }}

      - name: Get build information
        id: build_info
        run: |
          echo "DATE=$(date +'%Y-%m-%d %H:%M:%S UTC')" >> "$GITHUB_OUTPUT"
          echo "SHORT_SHA=$(echo $GITHUB_SHA | cut -c1-8)" >> "$GITHUB_OUTPUT"
          echo "BRANCH=$(echo $GITHUB_REF | sed 's|refs/heads/||')" >> "$GITHUB_OUTPUT"
          echo "COMMIT_MSG=$(git log -1 --pretty=%B | head -1)" >> "$GITHUB_OUTPUT"
          echo "AUTHOR=$(git log -1 --pretty=%an)" >> "$GITHUB_OUTPUT"

      - name: Check the change marks
        run: make check

      - name: Build documents
        run: make compile

      - name: Name the PDFs for the release
        run: |
          cp build/Organisationssatzung.pdf Report_Latest.pdf
          cp build/Organisationssatzung_Aenderungen.pdf Report_Aenderungen_Latest.pdf
          for name in QSM-Ordnung Finanzordnung Beitragssatzung; do
            cp "build/$name.pdf" "${name}_Latest.pdf"
            cp "build/${name}_Aenderungen.pdf" "${name}_Aenderungen_Latest.pdf"
          done

      - name: Generate release notes
        run: |
          cat << 'EOF' > release_notes.md
          ## 🔄 Latest Development Build

          **Build Date:** ${{ steps.build_info.outputs.DATE }}
          **Commit:** [`${{ steps.build_info.outputs.SHORT_SHA }}`](https://github.com/${{ github.repository }}/commit/${{ github.sha }})
          **Branch:** `${{ steps.build_info.outputs.BRANCH }}`
          **Author:** ${{ steps.build_info.outputs.AUTHOR }}

          ### 📝 Last Commit Message
          ```
          ${{ steps.build_info.outputs.COMMIT_MSG }}
          ```

          ### 🔧 Build System
          - **Engine:** Typst ${{ env.TYPST_VERSION }}
          - **Template:** [hsrtreport-typst](https://github.com/frederikbeimgraben/hsrtreport-typst)

          ### 📦 Download Files
          - `Report_Latest.pdf` - the latest Organisationssatzung
          - `QSM-Ordnung_Latest.pdf` - the latest QSM-Ordnung
          - `Finanzordnung_Latest.pdf` - the latest Finanzordnung
          - `Beitragssatzung_Latest.pdf` - the latest Beitragssatzung

          Each statute also comes as `<name>_Aenderungen_Latest.pdf`. This
          version shows the changes from the previous version: new text is
          highlighted, deleted text is struck through.
          EOF

      - name: Upload build artifact
        uses: actions/upload-artifact@v5
        with:
          name: build-${{ steps.build_info.outputs.SHORT_SHA }}
          path: |
            Report_Latest.pdf
            QSM-Ordnung_Latest.pdf
            Finanzordnung_Latest.pdf
            Beitragssatzung_Latest.pdf
            Report_Aenderungen_Latest.pdf
            QSM-Ordnung_Aenderungen_Latest.pdf
            Finanzordnung_Aenderungen_Latest.pdf
            Beitragssatzung_Aenderungen_Latest.pdf
          retention-days: 30
          if-no-files-found: error

      - name: Create or update the Latest release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "🔄 Latest Development Build"
          body_path: release_notes.md
          files: |
            Report_Latest.pdf
            QSM-Ordnung_Latest.pdf
            Finanzordnung_Latest.pdf
            Beitragssatzung_Latest.pdf
            Report_Aenderungen_Latest.pdf
            QSM-Ordnung_Aenderungen_Latest.pdf
            Finanzordnung_Aenderungen_Latest.pdf
            Beitragssatzung_Aenderungen_Latest.pdf
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
