name: Build und Release des aktuellen Stands

on:
  push:
    branches:
      - main
    tags-ignore:
      - "v*.*.*"
      - "release-*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  TYPST_VERSION: "0.15.1"

jobs:
  build-and-update-latest:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Typst installieren
        uses: ./.github/actions/install-typst
        with:
          version: ${{ env.TYPST_VERSION }}

      - name: Daten zum Build lesen
        id: build_info
        run: |
          echo "DATE=$(date +'%Y-%m-%d %H:%M:%S UTC')" >> "$GITHUB_OUTPUT"
          echo "SHORT_SHA=$(echo $GITHUB_SHA | cut -c1-8)" >> "$GITHUB_OUTPUT"
          echo "BRANCH=$(echo $GITHUB_REF | sed 's|refs/heads/||')" >> "$GITHUB_OUTPUT"
          echo "COMMIT_MSG=$(git log -1 --pretty=%B | head -1)" >> "$GITHUB_OUTPUT"
          echo "AUTHOR=$(git log -1 --pretty=%an)" >> "$GITHUB_OUTPUT"

      - name: Änderungsmarkierungen prüfen
        run: make check

      - name: PDFs bauen
        run: make compile

      - name: PDFs für das Release benennen
        run: |
          cp build/Organisationssatzung.pdf Report_Latest.pdf
          cp build/Organisationssatzung_Aenderungen.pdf Report_Aenderungen_Latest.pdf
          for name in QSM-Ordnung Finanzordnung Beitragssatzung; do
            cp "build/$name.pdf" "${name}_Latest.pdf"
            cp "build/${name}_Aenderungen.pdf" "${name}_Aenderungen_Latest.pdf"
          done

      - name: Release-Text schreiben
        run: |
          cat << 'EOF' > release_notes.md
          Stand: ${{ steps.build_info.outputs.DATE }}, Commit [`${{ steps.build_info.outputs.SHORT_SHA }}`](https://github.com/${{ github.repository }}/commit/${{ github.sha }}), Typst ${{ env.TYPST_VERSION }}

          | Datei | Inhalt |
          | --- | --- |
          | `Report_Latest.pdf` | Organisationssatzung |
          | `Finanzordnung_Latest.pdf` | Finanzordnung |
          | `Beitragssatzung_Latest.pdf` | Beitragssatzung |
          | `QSM-Ordnung_Latest.pdf` | QSM-Ordnung |

          Die Dateien `<Name>_Aenderungen_Latest.pdf` zeigen die Änderungen
          zur Vorfassung. Neuer Text ist gelb. Gestrichener Text ist gelb und
          durchgestrichen.
          EOF

      - name: PDFs als Artefakt hochladen
        uses: actions/upload-artifact@v5
        with:
          name: build-${{ steps.build_info.outputs.SHORT_SHA }}
          path: |
            Report_Latest.pdf
            QSM-Ordnung_Latest.pdf
            Finanzordnung_Latest.pdf
            Beitragssatzung_Latest.pdf
            Report_Aenderungen_Latest.pdf
            QSM-Ordnung_Aenderungen_Latest.pdf
            Finanzordnung_Aenderungen_Latest.pdf
            Beitragssatzung_Aenderungen_Latest.pdf
          retention-days: 30
          if-no-files-found: error

      # GitHub zeigt das Datum der ersten Veröffentlichung. Deshalb löscht der
      # Workflow das alte Release mit seinem Tag und erstellt es neu.
      - name: Altes Release des aktuellen Stands löschen
        if: github.event_name == 'push'
        run: gh release delete latest --cleanup-tag --yes || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

      - name: Release des aktuellen Stands erstellen
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          target_commitish: ${{ github.sha }}
          name: "Aktueller Stand"
          body_path: release_notes.md
          files: |
            Report_Latest.pdf
            QSM-Ordnung_Latest.pdf
            Finanzordnung_Latest.pdf
            Beitragssatzung_Latest.pdf
            Report_Aenderungen_Latest.pdf
            QSM-Ordnung_Aenderungen_Latest.pdf
            Finanzordnung_Aenderungen_Latest.pdf
            Beitragssatzung_Aenderungen_Latest.pdf
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
